name: Refresh contribution snapshot

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install renderer dependencies
        run: python -m pip install --upgrade pillow requests

      - name: Render current contribution snapshot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/generate_profile_telemetry.py --user Jonnywik

      - name: Check profile assets and boundaries
        run: python scripts/check_profile.py

      - name: Commit refreshed snapshot when totals changed
        run: |
          if git diff --quiet -- assets/github-activity-card.png README.md; then
            echo "Contribution snapshot is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-activity-card.png README.md
          git commit -m "chore: refresh contribution snapshot"
          git push
