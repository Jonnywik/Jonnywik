name: Refresh public telemetry

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install renderer dependencies
        run: python -m pip install --upgrade pillow requests

      - name: Render current public telemetry
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/generate_profile_activity_card.py --user Jonnywik
          python scripts/generate_recent_activity_feed.py --user Jonnywik

      - name: Commit refreshed telemetry when activity changed
        run: |
          if git diff --quiet -- assets/github-activity-card.png assets/recent-activity-feed.png README.md; then
            echo "Telemetry asset is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-activity-card.png assets/recent-activity-feed.png README.md
          git commit -m "chore: refresh public telemetry"
          git push
